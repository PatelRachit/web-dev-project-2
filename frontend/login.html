<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotCheck - Login</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>SpotCheck</h1>
                <p>Real-time Campus Study Space Tracker</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <form id="loginFormElement">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" required placeholder="your.email@university.edu">
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" required placeholder="Enter your password">
                    </div>

                    <div id="loginError" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>

                <p class="auth-switch">
                    Don't have an account? <a href="#" id="showRegister">Register here</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <h2>Create Account</h2>
                <form id="registerFormElement">
                    <div class="form-group">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" name="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" name="email" required placeholder="your.email@university.edu">
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" name="password" required placeholder="At least 6 characters">
                    </div>

                    <div class="form-group">
                        <label for="registerMajor">Major</label>
                        <input type="text" id="registerMajor" name="major" required placeholder="Computer Science">
                    </div>

                    <div class="form-group">
                        <label for="registerGradYear">Graduation Year</label>
                        <input type="text" id="registerGradYear" name="graduationYear" required placeholder="2025">
                    </div>

                    <div id="registerError" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">Register</button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="#" id="showLogin">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript Module -->
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
