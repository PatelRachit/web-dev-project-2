<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotCheck - Browse Spaces</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/spaces.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>SpotCheck</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="spaces.html" class="active">Spaces</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="page-header">
            <h2>Browse Study Spaces</h2>
            <p>Find the perfect spot for your study session</p>
        </section>

        <!-- Filters -->
        <section class="filters-section">
            <div class="filters">
                <div class="filter-group">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="">All</option>
                        <option value="library">Library</option>
                        <option value="cafe">Cafe</option>
                        <option value="lounge">Lounge</option>
                        <option value="study_room">Study Room</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="buildingFilter">Building:</label>
                    <select id="buildingFilter" class="filter-select">
                        <option value="">All</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Amenities:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" class="amenity-filter" value="outlets"> Outlets
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="amenity-filter" value="wifi"> WiFi
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="amenity-filter" value="whiteboard"> Whiteboard
                        </label>
                    </div>
                </div>

                <button id="clearFilters" class="btn btn-secondary">Clear</button>
            </div>
        </section>

        <!-- Spaces Grid -->
        <section class="spaces-section">
            <div id="loadingSpinner" class="loading">Loading...</div>
            <div id="spacesGrid" class="spaces-grid"></div>
            <div id="noResults" class="no-results" style="display: none;">
                No spaces found.
            </div>
        </section>
    </main>

    <!-- Space Detail Modal -->
    <div id="spaceModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="spaceDetails"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 SpotCheck</p>
        </div>
    </footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/spaces.js"></script>
</body>
</html>
